version: '3.9'

services:
  client:
    profiles:
      - dev
    build:
      target: builder
      context: ../../
      dockerfile: ./apps/client/Dockerfile
    image: biblio-num/client:dev
    container_name: biblio-num_client
    ports:
      - 8080:8080
    networks:
      - biblio-num-network
    command: pnpm --filter @biblio-num/client run dev:client-in-docker

  server:
    profiles:
      - dev
    build:
      target: builder
      context: ../../
      dockerfile: ./apps/server/Dockerfile
    image: biblio-num/server:dev
    container_name: biblio-num_server
    depends_on:
      - db
    ports:
      - 3000:3000
    networks:
      - biblio-num-network
    command: pnpm run dev:server-in-docker
    env_file:
      - .env.docker

  worker-sync:
    profiles:
      - dev
    build:
      target: builder
      context: ../../
      dockerfile: ./apps/server/Dockerfile
    image: biblio-num/worker-sync:dev
    container_name: biblio-num_worker_sync
    depends_on:
      - db
    networks:
      - biblio-num-network
    command: pnpm run start:worker-sync
    env_file:
      - .env.docker

  worker-file:
    profiles:
      - dev
    build:
      target: builder
      context: ../../
      dockerfile: ./apps/server/Dockerfile
    image: biblio-num/worker-file:dev
    container_name: biblio-num_worker_file
    depends_on:
      - db
    networks:
      - biblio-num-network
    command: pnpm run start:worker-file
    env_file:
      - .env.docker
  db:
    profiles:
      - dev
      - simple-dev
      - db-only
      - ci
    image: postgres:14.5
    container_name: biblio-num_db
    environment:
      POSTGRES_DB: biblio-num
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
    # ports:
    #  - "5432:5432"
    volumes:
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - type: volume
        source: biblio-num-db-volume
        target: /var/lib/postgresql/data
    networks:
      - biblio-num-network

  adminer:
    profiles:
      - adminer
      - dev
    image: adminer
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
#    ports:
#      - 8010:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DEFAULT_SYSTEM=PostgreSQL
      - ADMINER_DESIGN=lucas-sandery
    networks:
      - biblio-num-network

  pgadmin:
    profiles:
      - pgadmin
    image: dpage/pgadmin4
    container_name: biblio-num_dbadmin
    depends_on:
      - db
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
#    ports:
#      - 3010:80
    volumes:
      - type: volume
        source: biblio-num-pgadmin-volume
        target: /var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin
      PGADMIN_DEFAULT_PASSWORD: password
    networks:
      - biblio-num-network

  mailhog:
    profiles:
      - dev
      - simple-dev
      - tests-e2e
    container_name: mailhog
    image: mailhog/mailhog
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
#    ports:
#        - 1025:1025
#        - 8025:8025
    networks:
      - biblio-num-network

  s3:
    profiles:
      - dev
      - simple-dev
      - tests-e2e
      - s3-only
    image: quay.io/minio/minio:RELEASE.2023-01-20T02-05-44Z
    container_name: biblio-num_minio
    environment:
      MINIO_ROOT_USER: admin # MINIO_ACCESS_KEY = MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: password # MINIO_SECRET_KEY = MINIO_ROOT_PASSWORD
    volumes:
      - type: volume
        source: biblio-num-s3-volume
        target: /data
    command: server --address ":9000" --console-address ":9001" /data
    networks:
      - biblio-num-network

  redis:
    profiles:
      - dev
      - simple-dev
      - ci
    image: public.ecr.aws/bitnami/redis:latest
    platform: linux/amd64
    container_name: redis
    platform: linux/amd64
    environment:
      - REDIS_PASSWORD=redis
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
#    ports:
#      - "6379:6379"
    networks:
      - biblio-num-network

  bullboard:
    profiles:
      - dev
      - simple-dev
    container_name: bullboard
    image: deadly0/bull-board
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
#    ports:
#      - 3010:3000
    networks:
      - biblio-num-network
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis
      BULL_PREFIX: bull
      USER_LOGIN: admin
      USER_PASSWORD: password
    depends_on:
      - redis

  http-proxy-auth:
    profiles:
      - dev
      # - simple-dev
    build:
      context: ../../
      dockerfile: ./apps/http-proxy/Dockerfile
    container_name: http-proxy-auth
    image: biblio-num/http-proxy-auth
#    Les developpeurs devraient configurer leur propre override de port dans docker-compose.override.yml si ils souhaitent changer
#    ports:
#      - 8888:8080
    networks:
      - biblio-num-network
    environment:
      TYPE_NGINX: basic-auth
      BASIC_AUTH_USER_PASSWORD: 'admin-bn:$$apr1$$hjPQpN74$$S06f5oALFiHXEXFS77vjE1' # admin-bn:password, hash('password') = $apr1$hjPQpN74$S06f5oALFiHXEXFS77vjE1, replace $ with $$
      ADMINER_PROXY_PASS: http://adminer:8080

networks:
  biblio-num-network:
    name: biblio-num-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

volumes:
  biblio-num-pgadmin-volume:
  biblio-num-s3-volume:
  biblio-num-db-volume:
  biblio-num-server-node_modules-volume:
  biblio-num-worker-node_modules-volume:
